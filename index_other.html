<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Экраны: Дневник Гнева и Рулетка</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #311042 100%); }
    .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .accent-gradient { background: linear-gradient(90deg, #F43F5E 0%, #FB923C 100%); }
  </style>
</head>
<body class="gradient-bg text-slate-100 min-h-screen p-4 md:p-8 flex flex-col justify-center items-center gap-8">

  <!-- Вкладки переключения экранов для демо -->
  <div class="flex gap-2 glass-card p-1.5 rounded-xl text-xs font-bold">
    <button id="btn-roulette" onclick="showScreen('roulette')" class="px-4 py-2 rounded-lg accent-gradient text-white transition">🎲 Магическая рулетка</button>
    <button id="btn-diary" onclick="showScreen('diary')" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white transition">📖 Дневник гнева</button>
  </div>

  <!-- ЭКРАН 1: МАГИЧЕСКАЯ РУЛЕТКА -->
  <main id="screen-roulette" class="max-w-md w-full glass-card rounded-3xl p-6 space-y-6 text-center shadow-2xl">
    <div>
      <span class="text-xs font-semibold text-rose-400 uppercase tracking-widest">Экспресс-выгрузка</span>
      <h2 class="text-2xl font-black uppercase mt-1">Магическая рулетка</h2>
      <p class="text-xs text-slate-300 mt-1">Застрял в зажиме? Вращай и выполняй практику прямо сейчас.</p>
    </div>

    <!-- Интерактивное колесо / карточка -->
    <div class="relative py-8 flex justify-center items-center">
      <div id="roulette-card" class="w-64 h-64 glass-card rounded-2xl border-2 border-rose-500/30 flex flex-col items-center justify-center p-4 transition-all duration-500 transform scale-100 shadow-xl shadow-rose-500/10">
        <span id="roulette-icon" class="text-5xl mb-3">⚡</span>
        <h3 id="roulette-title" class="font-bold text-base text-slate-100 mb-1">Готов сбросить пар?</h3>
        <p id="roulette-desc" class="text-xs text-slate-400">Нажми кнопку ниже, чтобы получить индивидуальную практику из базы 300+</p>
      </div>
    </div>

    <button onclick="spinRoulette()" class="w-full accent-gradient hover:opacity-95 text-white font-black py-4 px-6 rounded-xl shadow-lg shadow-rose-500/25 active:scale-95 transition uppercase text-sm tracking-wide">
      🎯 Вращать рулетку!
    </button>
  </main>


  <!-- ЭКРАН 2: ДНЕВНИК ГНЕВА (КПТ-цепочка) -->
  <main id="screen-diary" class="max-w-md w-full glass-card rounded-3xl p-6 space-y-5 shadow-2xl hidden">
    <div>
      <span class="text-xs font-semibold text-emerald-400 uppercase tracking-widest">Аналитика и контроль</span>
      <h2 class="text-2xl font-black uppercase mt-1">Дневник гнева</h2>
      <p class="text-xs text-slate-300 mt-1">Разбери цепочку: Триггер ➔ Мысль ➔ Реакция ➔ Действие</p>
    </div>

    <form onsubmit="event.preventDefault(); alert('Запись сохранена в ваш ресурсный трекер!');" class="space-y-4 text-xs">
      <!-- 1. Триггер -->
      <div class="space-y-1">
        <label class="font-semibold text-slate-300 flex justify-between">
          <span>1. Что произошло? (Триггер)</span>
          <span class="text-slate-500">Ситуация</span>
        </label>
        <input type="text" placeholder="Например: Насяльник обесценил отчет" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-rose-500">
      </div>

      <!-- 2. Автоматическая мысль -->
      <div class="space-y-1">
        <label class="font-semibold text-slate-300 flex justify-between">
          <span>2. Про что это для тебя? (Мысль)</span>
          <span class="text-slate-500">Убеждение</span>
        </label>
        <input type="text" placeholder="«Меня не уважают», «Я беспомощен»" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-rose-500">
      </div>

      <!-- 3. Телесная реакция -->
      <div class="space-y-1">
        <label class="font-semibold text-slate-300 flex justify-between">
          <span>3. Где отозвалось в теле? (Реакция)</span>
          <span class="text-slate-500">Ощущения</span>
        </label>
        <select class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-rose-500">
          <option>Сжало челюсть / гортань</option>
          <option>Тяжесть и зажим в плечах / шее</option>
          <option>Давит в грудной клетке</option>
          <option>Учащенное сердцебиение / ком в горле</option>
        </select>
      </div>

      <!-- 4. Новое осознанное действие -->
      <div class="space-y-1">
        <label class="font-semibold text-slate-300 flex justify-between">
          <span>4. Какое альтернативное действие выбираешь?</span>
          <span class="text-slate-500">Ресурс</span>
        </label>
        <textarea rows="2" placeholder="Сделать распевку, забрать свой авторитет обратно, обозначить границы..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-rose-500"></textarea>
      </div>

      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3.5 px-6 rounded-xl shadow-lg shadow-emerald-500/20 active:scale-95 transition uppercase text-xs tracking-wider">
        Сохранить и забрать ресурс ✨
      </button>
    </form>
  </main>

  <!-- Интерактивный JS скрипт -->
  <script>
    const practices = [
      { icon: "🎙️", title: "Распевка «Брррр»", desc: "Вибрируй губами и выдыхай со звуком БРРР 45 секунд. Сними зажим с лица и гортани." },
      { icon: "🥋", title: "Зажим-Релиз", desc: "Сжимай кулаки и плечи изо всех сил 7 секунд. На выдохе полностью расслабься. Повтори 3 раза." },
      { icon: "🎶", title: "Дуэт Госпел", desc: "Включи экспресс-трек в приложении и пропой эмоцию гнева во весь голос." },
      { icon: "💆", title: "Остеопатия шеи", desc: "Мягко промассируй затылочные бугры и трапецию. Сними блок «нагнутой головы»." },
      { icon: "🔥", title: "Письмо выплеска", desc: "Напиши на бумаге все самые злые слова без цензуры и сожги/разорви в клочья." }
    ];

    function showScreen(screen) {
      document.getElementById('screen-roulette').classList.toggle('hidden', screen !== 'roulette');
      document.getElementById('screen-diary').classList.toggle('hidden', screen !== 'diary');
      
      document.getElementById('btn-roulette').className = screen === 'roulette' ? 'px-4 py-2 rounded-lg accent-gradient text-white transition' : 'px-4 py-2 rounded-lg text-slate-400 hover:text-white transition';
      document.getElementById('btn-diary').className = screen === 'diary' ? 'px-4 py-2 rounded-lg accent-gradient text-white transition' : 'px-4 py-2 rounded-lg text-slate-400 hover:text-white transition';
    }

    function spinRoulette() {
      const card = document.getElementById('roulette-card');
      card.classList.add('scale-90', 'opacity-50');

      setTimeout(() => {
        const randomPractice = practices[Math.floor(Math.random() * practices.length)];
        document.getElementById('roulette-icon').innerText = randomPractice.icon;
        document.getElementById('roulette-title').innerText = randomPractice.title;
        document.getElementById('roulette-desc').innerText = randomPractice.desc;
        
        card.classList.remove('scale-90', 'opacity-50');
        card.classList.add('scale-105');
        setTimeout(() => card.classList.remove('scale-105'), 200);
      }, 300);
    }
  </script>
</body>
</html>
